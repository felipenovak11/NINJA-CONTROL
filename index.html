<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel de controle das missões da equipe TEC_NINJAS.">
    <title>Controle de missões | TEC_NINJAS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-Tec_Ninjas">
            <img src="Logo_Tec_Ninjas.png" alt="Logo da equipe TEC_NINJAS">
        </div>
        <div class="titulo">
            <h1>TEC_ <span>NINJAS</span></h1>
        </div>
    </header>

    <main>
        <div class="acoes-topo">
            <a href="combo.html" class="botao">Montar combo de missões</a>
            <a href="historico.html" class="botao">Ver histórico de combos</a>
        </div>

        <div class="carrossel-container">
            <button class="btn-seta" id="btn-ant" aria-label="Missões anteriores">&#10094;</button>

            <div class="carrossel-janela" id="janela">
                <!-- Os cards são criados pelo script no final da página -->
                <section class="missoes-grid" id="missoes"></section>
            </div>

            <button class="btn-seta" id="btn-prox" aria-label="Próximas missões">&#10095;</button>
        </div>
    </main>

    <script>
        // ===== Configuração =====
        const TOTAL_MISSOES = 15; // para adicionar a missão 16, basta mudar este número
        const GAP = 30;           // mesmo valor do "gap" no style.css

        // ===== Cria os cards =====
        const lista = document.getElementById('missoes');

        for (let n = 1; n <= TOTAL_MISSOES; n++) {
            const imagem = encodeURI(`Missão ${n}.png`); // se renomear as imagens, troque aqui
            lista.insertAdjacentHTML('beforeend', `
                <article class="card">
                    <h3>Missão ${n}</h3>
                    <div class="img-missoes">
                        <img src="${imagem}" alt="Imagem da missão ${n}" loading="lazy">
                    </div>
                    <a href="ControleM${n}.html" class="botao">Ir para o controle da missão ${n}</a>
                </article>
            `);
        }

        // ===== Setas do carrossel =====
        const janela = document.getElementById('janela');
        const btnAnt = document.getElementById('btn-ant');
        const btnProx = document.getElementById('btn-prox');

        function passo() {
            return janela.clientWidth + GAP;
        }

        btnProx.addEventListener('click', () => janela.scrollBy({ left: passo() }));
        btnAnt.addEventListener('click', () => janela.scrollBy({ left: -passo() }));

        // Desativa a seta quando chega no começo ou no fim
        function atualizarSetas() {
            btnAnt.disabled = janela.scrollLeft <= 0;
            btnProx.disabled = janela.scrollLeft + janela.clientWidth >= janela.scrollWidth - 1;
        }

        janela.addEventListener('scroll', atualizarSetas);
        window.addEventListener('resize', atualizarSetas);
        atualizarSetas();
    </script>

</body>
</html>
